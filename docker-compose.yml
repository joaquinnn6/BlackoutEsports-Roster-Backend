services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-roster_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5436}:5432"
    volumes:
      - roster_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./blackout-roster
    ports:
      - "127.0.0.1:${SERVER_PORT:-8084}:8084"
    environment:
      SERVER_PORT: 8084
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-roster_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
      ENTRA_ISSUER: ${ENTRA_ISSUER:-}
      ENTRA_AUDIENCE: ${ENTRA_AUDIENCE:-}
      ENTRA_SCOPE: ${ENTRA_SCOPE:-access_as_user}
      COGNITO_ISSUER: ${COGNITO_ISSUER:-}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000,http://localhost:3001}
    depends_on:
      db:
        condition: service_healthy
volumes:
  roster_data:
