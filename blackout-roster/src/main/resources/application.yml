server:
  port: ${SERVER_PORT:8084}
spring:
  application:
    name: blackout-roster
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5436}/${DB_NAME:roster_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:3001}
  security:
    entra-issuer: ${ENTRA_ISSUER:}
    entra-audience: ${ENTRA_AUDIENCE:}
    entra-scope: ${ENTRA_SCOPE:access_as_user}
    cognito-issuer: ${COGNITO_ISSUER:}
    cognito-client-id: ${COGNITO_CLIENT_ID:}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
